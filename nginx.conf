server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 10m;

    # Folder internal tidak boleh diakses publik (Bagian 3.7).
    location ~ ^/(config|storage|lib|modules|database|tools|tests|\.git)(/|$) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    gzip on;
    gzip_types text/html text/css application/json application/javascript text/plain;
    gzip_min_length 1024;
}
