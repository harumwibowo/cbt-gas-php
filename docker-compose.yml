services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    depends_on:
      - php

  php:
    build: .
    environment:
      CBT_DB_HOST: mysql
      CBT_DB_PORT: 3306
      CBT_DB_NAME: ${MYSQL_DATABASE:-cbt_gas}
      CBT_DB_USER: ${MYSQL_USER:-cbt_user}
      CBT_DB_PASS: ${MYSQL_PASSWORD:-cbt_pass}
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cbt_gas}
      MYSQL_USER: ${MYSQL_USER:-cbt_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cbt_pass}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

volumes:
  mysql-data:
